# Publishes this fork's personal, server-less build to GitHub Pages:
# https://dan66redford-maker.github.io/openGym/ — open it in Safari, Share → Add to Home Screen.
#
# Pages serves static files only, so this build has no backend — VITE_STANDALONE=1 makes the app
# boot straight into guest mode, empty, with every workout kept in that browser's storage (see
# frontend/src/lib/standalone.js). Upstream deploys the seeded demo (VITE_DEMO=1) from this same
# file; this fork swaps that for the standalone build.
# The exercise images/GIFs (~140 MB) are never committed here; the build points at the
# upstream dataset on jsDelivr instead, pinned to a commit so the CDN can cache it forever.
name: Deploy standalone app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DATASET: https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_STANDALONE: '1'
          VITE_IMG_BASE: ${{ env.DATASET }}/images/
          VITE_GIF_BASE: ${{ env.DATASET }}/videos/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
